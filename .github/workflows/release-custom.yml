# Сборка релиза кастомного клиента: на пуш тега custom-b* собирает desktop-джарник и публикует
# GitHub Release. Имя релиза = запечённый clientVersion (BeControl сравнивает именно имя релиза
# с Version.clientVersion, см. core/src/mindustry/net/BeControl.java), поэтому апдейтер в игре
# видит новую сборку сразу после публикации.
#
# Тег обычно не пишется руками - используй scripts/tag-release.sh, он даёт версии вида
# custom-b2026.09.22 (при нескольких релизах за день - custom-b2026.09.22.2 и т.д.).
name: Release custom client

on:
  push:
    tags:
      - 'custom-b*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # полная история + теги: заметки релиза строятся из коммитов между соседними тегами custom-b*
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build desktop jar
        run: |
          ./gradlew desktop:dist --console=plain \
            -PclientVersion="${{ github.ref_name }}" \
            -PupdateUrl="${{ github.repository }}"

      # Заметки релиза = коммиты ветки между предыдущим тегом custom-b* (ближайший меньший номер)
      # и этим. Их читает диалог «Что нового» в клиенте (core/src/sonkaextras/WhatsNew.java):
      # строки «- » - пункты, «  - » - подпункты. --first-parent: мерж апстрима (upstream-sync.yml)
      # даёт одну строку «Merge ...», а не сотни чужих коммитов. Тело коммита добавляется
      # подпунктами, если оно само оформлено списком (так пишутся наши коммиты с пачкой фиксов);
      # трейлеры Co-Authored-By/Claude-Session отбрасываются.
      - name: Compose release notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git tag -l 'custom-b*' --sort=-v:refname | awk -v t="$TAG" 'found{print; exit} $0==t{found=1}')
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          echo "notes range: $RANGE"
          RS1=$(printf '\036'); FS1=$(printf '\037')
          {
            echo "## Изменения"
            git log "$RANGE" --first-parent --pretty='%x1e%s%x1f%b' | tr -d '\r' \
              | awk -v RS="$RS1" -v FS="$FS1" 'NF{
                  sub(/[ \t]+$/, "", $1); print "- " $1;
                  n=split($2, L, "\n");
                  for(i=1;i<=n;i++){ l=L[i]; sub(/^[ \t]+/, "", l);
                    if(l ~ /^[-*] / && l !~ /Co-Authored-By|Claude-Session/){ sub(/^[-*] /, "", l); print "  - " l }
                  }
                }' | head -n 150
            echo
            echo "Сборка: ${{ github.sha }}"
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp desktop/build/libs/Mindustry.jar Mindustry-custom-desktop.jar
          gh release create "${{ github.ref_name }}" Mindustry-custom-desktop.jar \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
