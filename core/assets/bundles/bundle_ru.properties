eui.load-error = Extended UI: ошибка при загрузке {0} \nПожалуйста, сообщите об ошибке на GitHub

eui.autofill-priority.title = Приоритет авто-заполнения
eui.autofill-priority.hint = Блоки с более высоким приоритетом Auto Transfer обслуживает первыми, если рядом их несколько; -2 полностью исключает блок из авто-переноса. По умолчанию - 0.
eui.autofill-priority.search = Поиск
eui.autofill-priority.no-results = Блоки не найдены

eui.category.turret = Турели
eui.category.production = Производство
eui.category.distribution = Распределение
eui.category.liquid = Жидкости
eui.category.power = Энергия
eui.category.defense = Защита
eui.category.crafting = Создание
eui.category.units = Единицы
eui.category.effect = Утилиты
eui.category.logic = Логика

setting.eui-showPowerBar.name = Отображать энергию
setting.eui-showPowerBar.desc = Показывать глобальный статус энергии и предупреждения о разрыве сети
setting.eui-showFactoryProgress.name = Отображать прогресс фабрик
setting.eui-showFactoryProgress.desc = Показывать прогресс производства на фабриках и реконструкторах
setting.eui-showUnitBar.name = Отображать полоски здоровья и щитов
setting.eui-showUnitBar.desc = Вспышка полоски здоровья/щита над юнитом на несколько секунд при изменении, затем затухание (может снизить FPS). Пересекается с постоянной полоской ХП юнитов из MI2U - включайте только одну
setting.eui-ShowUnitTable.name = Отображать таблицу юнитов
setting.eui-ShowUnitTable.desc = Показывать таблицу лучших типов юнитов по командам
setting.eui-UnitsTableAlpha.name = Прозрачность таблицы юнитов
setting.eui-UnitsTableAlpha.desc = Прозрачность таблицы юнитов (0% = полностью скрыта)
setting.eui-ShowSchematicsTable.name = Отображать таблицу схем
setting.eui-ShowSchematicsTable.desc = Показывать таблицу быстрого доступа к схемам
setting.eui-ShowSchematicsPreview.name = Отображать превью схем
setting.eui-ShowSchematicsPreview.desc = Показывать превью схемы при наведении
setting.eui-ShowBlockInfo.name = Отображать информацию о блоках
setting.eui-ShowBlockInfo.desc = Показывать дополнительную информацию о вражеских блоках
setting.eui-ShowAlerts.name = Отображать оповещения
setting.eui-ShowAlerts.desc = Показывать оповещения об атаках и потере поддержки
setting.eui-ShowAlertsBottom.name = Отображать оповещения внизу
setting.eui-ShowAlertsBottom.desc = Показывать оповещения в нижней части экрана
setting.eui-ShowResourceRate.name = Отображать прирост ресурсов
setting.eui-ShowResourceRate.desc = Показывать скорость производства ресурсов
setting.eui-SchematicsTableRows.name = Количество рядов в таблице схем
setting.eui-SchematicsTableRows.desc = Ряды по умолчанию для НОВЫХ страниц - у каждой страницы свой фиксированный размер (ПКМ по вкладке или названию страницы)
setting.eui-SchematicsTableColumns.name = Количество столбцов в таблице схем
setting.eui-SchematicsTableColumns.desc = Колонны по умолчанию для НОВЫХ страниц - у каждой страницы свой фиксированный размер (ПКМ по вкладке или названию страницы)
setting.eui-SchemTableColFirst.name = Порядок цифр бинда ячейки: сначала колонна
setting.eui-SchemTableColFirst.desc = "G + две цифры" берёт схему ячейки в руку: выкл = ряд, затем колонна; вкл = колонна, затем ряд (цифра 0 = десятая)
setting.eui-SchemTableAutoIcons.name = Авто-иконки по содержимому схемы
setting.eui-SchemTableAutoIcons.desc = Ячейки со схемой, но без вручную выбранных иконок, показывают до 4 самых значимых её блоков (по количеству x площади): заводы, буры, заводы юнитов, турели... Конвейеры, трубы, мосты, разгрузчики, энергоузлы и стены игнорируются. В сохранение ничего не пишется - иконка, выбранная вручную, всегда главнее
