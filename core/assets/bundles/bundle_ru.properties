# --- Mapping Utilities port (ApsZoldat, v1.9): скрытые правила карты, планетный фон,
# улучшенные диалоги бана/раскрытия контента, снятие лимитов размера карты ---
client.setting.modsec-mu.category = Mapping Utilities
client.features.mod.mu.desc = Расширения диалогов редактора карт: скрытые правила карты (цвета тумана/облаков, темнота за границей, множитель сопротивления, флаги Env, правила для любой команды 0-255, читы команд, имя режима, текст миссии), редактор планетного фона с 3D-превью, диалоги бана/раскрытия контента с фильтром по планете, размеры карты от 1 до 2147483647. Живёт внутри диалогов «Правила» и «Изменить размер» редактора.

setting.mu_rules_mod.name = Расширения окна правил
setting.mu_rules_mod.description = Главный выключатель всего, что Mapping Utilities добавляет в окно правил карты.
setting.mu_resize_mod.name = Снять лимиты размера карты
setting.mu_resize_mod.description = Размеры карты от 1 до 2147483647 в окне изменения размера. Гигантские карты ГАРАНТИРОВАННО съедят всю память - вы предупреждены.
setting.editor_hidden_rules.name = Включить скрытые правила
setting.editor_hidden_rules.description = Показывать правила, которые ванильное окно прячет: цвета тумана/облаков, темнота за границей, сопротивление, вселение, обновление грузов, правила любой команды, имя режима, миссия и т.д.
setting.editor_planet_background.name = Добавить настройки заднего фона
setting.editor_environment_settings.name = Добавить настройки окружения
setting.editor_environment_settings.description = Кнопка «Настройки окружения» в категории «Окружение» - сырые битовые флаги Env (планета/космос/под водой/споры/обжигание/нефть/вода/кислород).
setting.editor_better_content_dialogs.name = Улучшенные окна запрета контента
setting.editor_better_content_dialogs.description = Окна запрещённых блоков/единиц и отображаемых блоков получают фильтр по планете (вкладке базы данных) и размер кнопок ниже.
setting.editor_content_buttons_size.name = Размер кнопок контента
setting.editor_content_buttons_size.description = Размер кнопок блоков/единиц в улучшенных окнах контента.

