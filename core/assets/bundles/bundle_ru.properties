# sonkaextras: кастомизация курсоров мыши (sonkaextras.cursors)
client.setting.sonka-cursor-scale.name = Размер курсора
client.setting.sonka-cursor-scale.description = Масштаб всех курсоров мыши: стрелки, руки, текстового и контекстных (бур/выгрузка/прицел/ремонт). Применяется вживую; 100% = ваниль. ОС ограничивает аппаратный курсор 256px - больше не станет.
client.setting.sonka-cursor-configure.name = Курсоры...
client.setting.sonka-cursor-configure.description = Кастомизация каждого курсора игры: замена текстуры своей PNG, покраска тинтом, рисование в встроенном пиксельном редакторе, хотспот и импорт/экспорт всего набора как пака курсоров (zip).
client.sonka.cursors.title = Кастомизация курсоров
client.sonka.cursors.hint = Пер-курсорная настройка: [accent]PNG-файл[] заменяет текстуру (хранится в папке [accent]cursors[] каталога данных игры), [accent]тинт[] умножает её на цвет, в [accent]редакторе[] можно нарисовать свою попиксельно. Размер задаётся слайдером «Размер курсора» в настройках. Всё применяется сразу.
client.sonka.cursors.file = Заменить текстуру PNG-файлом...
client.sonka.cursors.color = Цвет тинта
client.sonka.cursors.reset = Сбросить этот курсор к ванили
client.sonka.cursors.file.invalid = Это не валидный PNG-файл.
client.sonka.cursors.file.badsize = Неподдерживаемый размер картинки: {0}x{1} (максимум {2}px по стороне).
client.sonka.cursors.export = Экспорт пака
client.sonka.cursors.import = Импорт пака
