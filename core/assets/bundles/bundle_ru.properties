# sonkaextras: уведомление о незапитанном начале протянутой цепочки труб/конвейеров (ChainWarn)
client.setting.sonka-chain-warn.name = Предупреждать о незапитанных цепочках труб
client.setting.sonka-chain-warn.description = Когда протянутая линия конвейеров/дактов/кондуитов достроена, предупреждает (кликабельный тост + мигающая рамка), если в её начало ничто не выдаёт - ни здание-источник, ни транзит за джанкшеном, ни план в очереди постройки
client.setting.sonka-chain-warn-end.name = Проверять и выход конца цепочки
client.setting.sonka-chain-warn-end.description = Дополнительно предупреждать, когда последний сегмент линии выдаёт в никуда (по умолчанию выкл - шумит при стройке навстречу ещё не поставленному потребителю)
client.setting.sonka-chain-warn-end-configure.name = Блоки предупреждения о выводах...
client.setting.sonka-chain-warn-end-configure.description = Выбор типов конвейеров/дактов/труб, для которых срабатывает предупреждение о выходе в никуда. Линии из невыбранных блоков не шумят. По умолчанию: все
client.sonka.chainwarn.filter.title = Блоки предупреждения о выводах
client.sonka.chainwarn.filter.hint = Предупреждение о [accent]выходе в никуда[] срабатывает только для линий из выбранных ниже блоков. Проверку входа этот фильтр не затрагивает.
client.sonka.chainwarn.start = [scarlet]Линия не запитана:[] в её начало ({0}, {1}) ничто не выдаёт
client.sonka.chainwarn.end = [scarlet]Линия в никуда:[] её выход ({0}, {1}) никуда не ведёт

# sonkaextras: инверсия роли Alt при повороте протягиваемой линии колесом (LineRotate)
client.setting.sonka-linerotate-configure.name = Блоки поворота линии...
client.setting.sonka-linerotate-configure.description = Выбор блоков, для которых колесо при протяжке линии крутит ВЕСЬ ряд без Alt, а Alt+колесо - только последний блок (инверсия обычного поведения). По умолчанию: эрекирские мосты-дакты/трубы
client.sonka.linerotate.title = Блоки поворота линии
client.sonka.linerotate.hint = Для отмеченных ниже блоков при протяжке линии: колесо мыши крутит [accent]весь ряд[], а [accent]Alt+колесо[] - только [accent]последний блок[] (удобно развернуть хвост моста вбок). Для неотмеченных - обычное поведение.
client.sonka.linerotate.default = По умолчанию (мосты Эрекира)
client.sonka.linerotate.all = Все
client.sonka.linerotate.none = Никакие

# sonkaextras: рестарт сектора / повтор волны в меню паузы кампании (CampaignRetry)
client.sonka.restartsector = Рестарт сектора
client.sonka.restartsector.tooltip = Сбросить сектор и высадиться на него заново с нуля с последним лоадаутом.
client.sonka.restartsector.confirm = Начать сектор заново с нуля?\nЕго сейв будет удалён, высадка повторится с последним лоадаутом. Отменить будет нельзя.
client.sonka.replaywave = Повторить волну
client.sonka.replaywave.tooltip = Загрузить автоснапшот, сделанный на старте текущей волны.
client.setting.sonka-wave-autosave.name = Автосейв на старте волны (Повторить волну)
client.setting.sonka-wave-autosave.description = В кампании делает снапшот игры на старте каждой волны (один скользящий снапшот на сектор, в списке сейвов не появляется) - его грузит кнопка «Повторить волну» в меню паузы. Выключите, если запись заметна как фриз при спавне волны.
client.setting.sonka-lastcontroller.name = Метка последнего управлявшего над юнитом
client.setting.sonka-lastcontroller.description = Над юнитами, которым игрок отдавал приказы (RTS-команды, смена команды) или которых брал под контроль, показывается приглушённая метка «↺ Ник» - и остаётся потом: видно, кто переставил юнитов. Пока юнитом управляют напрямую, метка скрыта (тогда виден живой ник).
client.setting.sonka-lastcontroller-self.name = Показывать свои метки
client.setting.sonka-lastcontroller-self.description = Помечать и юнитов, которым приказывали вы сами. На чужих серверах ваши приказы и так не помечаются (сервер не возвращает их отправителю).
client.setting.sonka-lastcontroller-timeout.name = Время жизни метки
client.setting.sonka-lastcontroller-timeout.description = Сколько метка держится после того, как игрок отпустил юнита. 0 = пока юнит жив.
client.sonka.lastcontroller.forever = пока жив
client.sonka.report.title = Лог для багрепорта
client.sonka.report.hint = Собирает всё нужное для разбора бага в один текст: версии Monolith и движка, ОС/Java/GPU, внешние моды, настройки (без секретов вроде usid/uuid/ключей), последние файлы крашей и хвост last_log.txt. «Скопировать» кладёт в буфер укороченную версию и заодно пишет полную в папку данных.
client.sonka.report.summary = Клиент: [accent]{0}[]\nДвижок: [accent]{1}[]\nВнешних модов: [accent]{2}[]\nФайлов крашей: [accent]{3}[]\nlast_log.txt: [accent]{4}[]
