# --- Too Many Items port (EB-wilson, v3.2, Kotlin): браузер рецептов (что из чего / где
# используется / что делает фабрика) + калькулятор схем (граф рецептов с балансировкой,
# статистикой, экспортом). Ключи misc.open/close/save/copy уже есть в бандле (newconsole).
# Перевод - наш, с нуля (апстримный ru-бандл мода наполовину состоял из «(нужен перевод) 中文»);
# сверено с en и zh_CN (первоисточник автора). Терминология: «карточка рецепта», «проект» (.shd-файл
# калькулятора, чтобы не путать со схемами Mindustry), «ускоритель» (optional input, как stat.booster
# в ванили), «условия среды» (environment item: плитки/атрибуты под блоком), «баланс» (balance amount) ---
client.setting.modsec-tmi.category = Too Many Items
client.features.mod.tmi.desc = Браузер рецептов в духе NEI/JEI: для каждого предмета, жидкости, юнита и блока - чем производится, где используется, что делает фабрика (разобраны все ванильные типы блоков, моды могут добавлять рецепты через recipes.json / recipeEntry / recipeScript), плюс «Калькулятор схем» - планировщик графа рецептов с балансировкой, автосоединением, статистикой и экспортом в PNG/текст. Входы: кнопка TMI в базе данных, кнопка TMI в карточке контента, перетаскиваемая плавающая кнопка; Ctrl (tmi_hot_key) + клик по иконке предмета внутри диалогов.
