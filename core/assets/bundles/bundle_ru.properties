client.sonka.campaign.switch.confirm = Переключить кампанию с «{0}» на «{1}»?\n\nТекущая кампания будет полностью забэкаплена (backups/), убрана в папку своего профиля, и игра [accent]перезапустится[], чтобы загрузить другую.
