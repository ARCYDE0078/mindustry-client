client.sonka.packs.guessed = Догадка по названию/описанию (не Java/JS). Раскрой карточку и нажми «Проверить состав», чтобы убедиться.
client.sonka.packs.guessed.long = По названию/описанию похож на ресурс-пак. В индексе модов нет списка файлов, так что это догадка - проверь ниже.
