client.features.mod.mi2u.name = MI2 Utilities
client.features.mod.qol.desc = QoL-набор sonka: мост-до-ядра, хелпер контроля, клеймы юнитов, быстрые тумблеры и плавающие окна - управляются из окна Hub.
client.features.mod.eui.desc = Extended UI++: таблица схем, приоритеты автозаполнения, панель информации о блоке, HP-бары юнитов, нижняя панель.
client.features.mod.campaignutils.desc = Утилиты кампании: статистика производства/импорта/экспорта по захваченным секторам, предпросмотр сектора без высадки.
client.features.mod.qolc.desc = Остаток QoL Control: многозадачность юнитов, радиус планов, автоподбор, чат-бинды, палитра цветов движка, библиотека mlog.
client.features.mod.mi2u.desc = Оконный фреймворк MI2U: Core Info, миникарта, инфо о волнах, Full AI, Logic Helper, эмодзи - окна включаются из QoL Hub.
client.features.mod.agzam4.desc = Промышленный калькулятор, генераторы процессоров/дисплеев, спавнер юнитов и хаб утилит (клавиша {0}), автоответ AFK, градиент чата.
client.features.mod.scheme.desc = Scheme Size: админ-инструменты, редактор правил карты, инструменты застройки, доп. отрисовка (рентген/сетка/линейка), предупреждение о волне.
client.features.mod.mindustrytool.desc = Интеграция mindustry-tool.com: браузер схем/карт, глобальный чат с переводом, Player Connect, умное бурение/апгрейд, фон и музыка меню.
client.features.mod.sonkaextras.desc = Мелкие фичи sonka: градиент ника, юнит фона меню, предупреждение о незапитанной цепочке, повтор волны и рестарт сектора, масштаб панелей, экспорт/импорт данных по категориям, профили кампании.
client.features.mod.helium.desc = Helium: размытие фона UI, быстрая палитра блоков в панели размещения, переработанный менеджер/браузер модов.

