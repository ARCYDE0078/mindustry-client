MI2UI.help = Главное окно MI2U.\
    \nДля ИИ нужна настройка "Подменить обработчик ввода".\
    \nКнопка ИИ открывает настройку режимов.\
    \nСтрелки: полёт к центру экрана. Cfg: забор предметов из ядра.\
    \nMono: добыча руды.\
    \nPoly: автоподлёт к планам постройки. Cfg: авто-перестройка, помощь союзникам.\
    \nRepair: летит чинить, когда HP юнита падает ниже 60%.\
    \nAT: ещё одно автоприцеливание. Cfg: цели - враги/повреждённые постройки.\
    \nWorld Processor: свой ИИ на логике. @unit - это игрок. Cfg: код логики.\
    \n\nТаймскейлер: автоматически замедляет течение времени до fps/60, чтобы низкий FPS не резал производительность заводов.
LogicHelper.help = Расширение встроенного редактора логики.\
    \n[yellow]Список переменных: работа с именами-атрибутами вроде "unit1.coords.x", "task.itemtype".\
    \nЕсть поле разделителя. Пустой разделитель - имена целиком; иначе имена режутся по разделителю.\
    \nПример: "unit1.coords.x" => "unit1.", "coords.", "x"\
    \nКлик - копировать фрагмент, кнопка слева - копировать имя целиком.\
    \nВНИМАНИЕ: чтобы перечитать список переменных, редактор логики нужно закрыть.\
    \n[yellow]Поиск: поиск/замена строки по всем текстовым полям.[]\
    \nЕсть режимы "слово целиком" и "с учётом регистра".\
    \n[yellow]Копия области: вырезать или скопировать блок инструкций в указанный адрес.[]\
    \nБлок задаётся начальным и конечным адресом (оба включительно).\
    \nБлок вставляется перед инструкцией с адресом вставки. Для вставки в конец укажите последний адрес + 1.\
    \nПри включённом "Перенос переходов" стрелки jump по возможности пересчитываются относительно.\
    \n[cyan]Атрибут: слой = редактор логики.
CoreInfo.help = Подробная информация о ядре: предметы (и их динамика), число юнитов, анализ энергосетей.\
    \nКнопка выбора команды переключает окно на данные другой команды.\
    \nКлик по иконкам предметов и наведение на полосы энергии - наблюдение за изменениями ресурсов.\
    \nКлик по иконкам юнитов или полосам энергии - перелёт камеры.

ai.preset.baseminemode = Добыча
ai.preset.baseminemode.intro = Автоматическая добыча руды.\nПоддерживает несколько типов руды, приоритет - чего меньше в ядре.\n\nИндикаторы руды: F - в полу, W - в стене.\nИспользует ванильный индекс руд.
ai.preset.autobuildmode = Слежение за планами постройки
ai.preset.autobuildmode.intro = Автоматически подлетает к планам постройки.\n\nОпции: авто-перестройка, помощь в стройке.
ai.preset.autobuildmode.support = Помощь в стройке
ai.preset.autobuildmode.rebuild = Авто-перестройка
ai.preset.autotargetmode = Автоприцеливание
ai.preset.autotargetmode.intro = Автоматически целится по видимым целям. Пока включено - подавляет нативный автоприцел (выключает его с тостом).
mi2u.autotarget.suppress-toast = Активен автоприцел MI2U: нативный Auto Target выключен
ai.preset.autotargetmode.attack = Атаковать врагов
ai.preset.autotargetmode.heal = Чинить постройки
ai.preset.centerfollowmode = Следовать за центром экрана
ai.preset.centerfollowmode.intro = Юнит сам летит к центру экрана (ПК)\nНа мобильных не действует (камера и так центрируется).
ai.preset.logicmode = Взломанный мировой процессор
ai.preset.logicmode.intro = Пишите собственный ИИ в виде кода мирового процессора.\
  \n\n\n\nКлючевые отличия:\
  \n\n[accent]@unit[] навсегда привязан к юниту игрока, перепривязка отключена. Поэтому [accent]Ucontrol, Ulocate[] работают напрямую.\
  \n\nДействия игрока разделены: движение/атака - два независимых таймера. 10 секунд без команды освобождают управление. [accent]Ucontrol-idle[] отпускает движение, [accent]Ucontrol-stop[] - атаку.\
  \n\nМировые датчики работают. Команды, меняющие мир ([accent]SetProp, Write, SetBlock[] и т.п.), - только в одиночной песочнице. Часть команд эмулирует игрока (например, [accent]Control-config[]).\
  \n\n[accent]Read, Write[] могут читать/писать переменные других ИИ мирового процессора: имя здания = имя целевого ИИ (строка), имя ячейки = имя переменной (строка). Read ищет сверху вниз, Write - снизу вверх; при дублях имён берётся первый найденный.\
  \n\nСвой UI через инструкции Print. Синтаксис:\
  \n[accent]UI.row()[]\
  \nНовый ряд UI\
  \n[accent]UI.clear()[]\
  \nОчистить UI\
  \n[accent]UI.button(переменная)[]\
  \nКнопка (пишет 1/0)\
  \n[accent]UI.field(переменная)[]\
  \nТекстовое поле (пишет число)\
  \n[accent]UI.choose(переменная)[]\
  \nВыбор содержимого (предмет/юнит/блок). Переменную нужно инициализировать значением такого типа.\
  \n[accent]UI.info(переменная)[]\
  \nМетка-монитор переменной.\
  \nПишите команды строками (в кавычках) в Print. Каждое исполнение создаёт новый элемент - вызывайте один раз при инициализации.
