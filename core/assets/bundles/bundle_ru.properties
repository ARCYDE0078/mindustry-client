bridgetocore-mode-bridge = Режим моста
bridgetocore-mode-junction = Режим перекрёстка
bridgetocore-mode-titanium = Режим титанового конвейера
bridgetocore-titanium-build = Режим титановой стройки: заменять вручную построенный титановый конвейер на сортировщики
bridgetocore-conveyor-build = Режим стройки конвейера: заменять вручную построенный обычный конвейер на сортировщики
bridgetocore-junction-build = Режим стройки перекрёстков: заменять вручную построенные перекрёстки на сортировщики на поворотах

setting.qol-bridge-to-core-enabled.name = Включить Мосты к ядру
setting.bridgetocore-turn-aversion.name = Избегание поворотов
setting.bridgetocore-turn-aversion.description = Насколько сильно поиск пути избегает поворотов. Больше - более прямые маршруты с меньшим числом изгибов (чаще в обход препятствий); меньше - более короткие маршруты, охотнее поворачивающие. 1x - исходное, не настроенное поведение.
setting.bridgetocore-no-turn-radius.name = Радиус "без поворотов" у ядра
setting.bridgetocore-no-turn-radius.description = На каком расстоянии от ядра (в клетках) поиск пути начинает сильно предпочитать прямой финальный подход вместо поворота.
setting.bridgetocore-min-turn-distance.name = Мин. расстояние поворота от ядра
setting.bridgetocore-min-turn-distance.description = Первая попытка поиска пути вообще запрещает поворот ближе этого расстояния к ядру. Если это невозможно из-за препятствий, автоматически откатывается на маршрут, который может повернуть ближе.
setting.bridgetocore-search-padding.name = Отступ области поиска
setting.bridgetocore-search-padding.description = Насколько далеко за пределы точек старта/финиша (в клетках) поиск пути готов искать обход препятствий. Больше - справляется с более крупными объездами на захламлённой базе, но перебирает больше клеток, то есть медленнее.
setting.bridgetocore-corner-penalty.name = Штраф за угол ядра
setting.bridgetocore-corner-penalty.description = Насколько сильно поиск пути избегает подхода к ядру в угол его контура вместо середины стороны.
setting.bridgetocore-center-priority.name = Приоритет центра ядра
setting.bridgetocore-center-priority.description = Насколько сильно поиск пути предпочитает точку подхода по центру стороны ядра вместо ближе к углу, относительно того, сколько лишнего пути это стоит.

