rules.hidespawns.info = Если включено, точки появления противника скрыты при просмотре карты.\nКогда показаны, радиус круга на карте - точный радиус точки появления. На миникарте они не отображаются никогда.
rules.pvpautopause.info = Приостанавливать PvP игру если на сервере всего 1 игрок.
rules.unitpayloadupdate.info = Если включено, грузы будут обновляться внутри боев. ед. Например, турели, подобранные боев. ед. будут стрелять в полёте.\nКогда эта опция включена, энергия будет распределяться между постройками в одной боев. ед. Однако загружать предметы в эти постройки на ходу невозможно.
rules.possessionallowed.info = Если выключено, игроки не могут вселяться в боев. ед. и постройки.
rules.ghostblocks.info = Если выключено, уничтоженные постройки не будут "запоминаться" и отображаться для починки.
rules.dragmultiplier.info = Множитель сопротивления среды. Боев. ед. теряют скорость быстрее при высших значениях.\nЕсли установлено на 0, боев. ед. совсем не будут терять скорость (как в космосе).
rules.staticfog.info = Статический туман войны - это полностью чёрные ещё неисследованные области.\nЕсли выключено, только полупрозрачный динамический туман останется на карте.
rules.cloudscolor.info = Цвет облаков во время анимации высадки ядра.
rules.borderdarkness.info = Если включено, область за границами карты будет затемнена цветом статического тумана войны.\nВыключение этого имеет хорошее применение в космических картах.
rules.disableoutsidearea.info = Отключать ли блоки за границами карты.
rules.cheat.info = Если включено, постройки команды будут авто генерировать необходимые для их работы ресурсы.
rules.coresspawnships.info = Если включено, стандартные корабли будут появляться из ядер.\nРаботает только для команд с RTS AI / Базостроительным AI.
rules.modename.info = Имя игрового режима, отображаемое в списке серверов за названием карты в формате:\n<ИмяКарты> / <ИмяРежима>
rules.mission.info = Текст миссии, отображаемый в верхнем углу экрана вместо счётчика волн/ядер.\nОставьте пустым для выключения. Однако, "\\n" не будет работать здесь, лучше попробуйте использовать задачи или мировые процессоры для изменения этого текста.
rules.planetbackground.info = Изменить параметры планеты, отображаемой на заднем фоне карты.\nЭтот задний фон отображается поверх клеток "Пусто" во время игры на карте. Имеет хорошее применение в космических картах.

# --- Testing Utilities port (MEEPofFaith, v69.10): песочничная панель BLUI (bottom-left) -
# спавнер юнитов/волны, блоки, террейн-пейнтер, статусы, мир/погода, песочница, ядро,
# команда, лечение, клон/самоуничтожение, свет, телепорт; интерполяции, звуковая комната ---
client.setting.modsec-testing.category = Testing Utilities
client.features.mod.testing.desc = Песочничная панель в левом нижнем углу HUD: спавнер юнитов с выбором волны, размещение блоков, террейн-пейнтер прямо в игре, статус-эффекты, меню мира/погоды, переключатель песочницы, заполнить/опустошить ядро, смена команды, лечение/неуязвимость, клон/самоуничтожение, выключатель света, телепорт Alt+клик (по желанию). Вне игры: визуализатор интерполяций и звуковая комната. Какая HUD-панель показывается (эта, Scheme Size или обе) - выбирается в Sonka Extras.

