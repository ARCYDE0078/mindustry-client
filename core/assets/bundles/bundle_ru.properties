patch-editor.editProgress.defaultHint = Подсказка: это встроенный скрипт по умолчанию, а не progress-скрипт текущего поля. Нажмите [accent]Учебник[], чтобы изучить синтаксис.
patch-editor.editProgress.tutorial = Учебник

patch-editor.editProgress.tutorial.title = Учебник по progress-скриптам

patch-editor.editProgress.tutorial.section.1.title = 1. Что такое progress-скрипт?
patch-editor.editProgress.tutorial.section.1.text.1 = Progress-скрипт - одно выражение. Оно начинается с [accent]build(...)[], затем цепочкой функций-преобразований даёт [accent]progress[]: значение (обычно 0~1), вычисляемое из параметров части (PartParams) и управляющее анимациями, смещениями, прозрачностью и т.д.
patch-editor.editProgress.tutorial.section.1.text.2 = Скрипт вычисляется вживую: предпросмотр выше проигрывает получившуюся кривую. При ошибке сообщение появляется в красной полосе, а [accent]OK[] блокируется.

patch-editor.editProgress.tutorial.section.2.title = 2. Функция build
patch-editor.editProgress.tutorial.section.2.text.1 = build - входная точка каждого скрипта. Она создаёт progress в одной из форм:
patch-editor.editProgress.tutorial.build.1.params = progress: встроенная переменная PartProgress (например warmup, heat, reload...)
patch-editor.editProgress.tutorial.build.1.desc = Взять встроенный progress за основу.
patch-editor.editProgress.tutorial.build.2.params = number: число (например 0.5)
patch-editor.editProgress.tutorial.build.2.desc = Создаёт константный progress.
patch-editor.editProgress.tutorial.build.3.params = progress: переменная PartProgress; interp: переменная Interp
patch-editor.editProgress.tutorial.build.3.desc = То же, что build(progress).curve(interp).

patch-editor.editProgress.tutorial.section.3.title = 3. Функции-цепочки
patch-editor.editProgress.tutorial.section.3.text.1 = К значению build(...) можно цеплять функции ниже - каждая возвращает новый progress, так что их можно свободно комбинировать.

patch-editor.editProgress.tutorial.op.group.basic = Без параметров
patch-editor.editProgress.tutorial.op.group.number = Числовые параметры (float)
patch-editor.editProgress.tutorial.op.group.progress = Progress-параметры (PartProgress)
patch-editor.editProgress.tutorial.op.group.interp = Параметр Interp

patch-editor.editProgress.tutorial.section.4.title = 4. Встроенные переменные
patch-editor.editProgress.tutorial.section.4.text.1 = Следующие переменные встроены в область видимости скрипта и доступны напрямую в build(...) и функциях выше.

