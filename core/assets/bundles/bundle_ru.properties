client.setting.sonka-maptags-manage.name = Теги карт...
client.setting.sonka-maptags-manage.description = Переименовать или удалить тег карты сразу везде. Тот же диалог открывается и карандашом рядом с фильтром тегов в списке карт. Сами теги добавляются по карте - из этого списка (значок-карандаш на карточке карты).
client.setting.sonka-hotkeys-open.name = Все хоткеи...
client.setting.sonka-hotkeys-open.description = Единый список всех горячих клавиш клиента и вшитых модов с поиском, по пакетам, с подсветкой конфликтов. Открывается также из подменю Monolith главного меню и своей клавишей (см. «Управление»).
client.setting.sonka-diag-report.name = Лог для багрепорта...
client.setting.sonka-diag-report.description = Скопировать или сохранить диагностический отчёт: версии, ОС/GPU, внешние моды, настройки без секретов, последние краши и хвост лога.
client.setting.monolith-whatsnew-auto.name = Показывать «что нового» после обновления
client.setting.monolith-whatsnew-auto.description = Один раз после каждого обновления клиента показывать заметки сборок, вышедших с прошлой (подтягиваются с GitHub).
client.setting.sonka-whatsnew-history.name = Релизы Monolith...
