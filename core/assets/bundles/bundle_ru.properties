client.sonka.hotkeys.title = Все хоткеи
client.sonka.hotkeys.search = Поиск по названию, клавише или пакету...
client.sonka.hotkeys.onlyconflicts = Только конфликты
client.sonka.hotkeys.hint = Все горячие клавиши клиента и вшитых модов одним списком. [accent]Оранжевая[] клавиша - та же комбинация занята другим действием (наведи - покажет каким; часть совпадений штатная и срабатывает в разных контекстах). «Переназначить» открывает обычное «Управление», отфильтрованное на эту клавишу.
client.sonka.hotkeys.controls = Управление
client.sonka.hotkeys.rebind = Переназначить
client.sonka.hotkeys.configure = Настроить
client.sonka.hotkeys.unset = не назначена
client.sonka.hotkeys.conflict = Также назначена на:
client.sonka.hotkeys.empty = Ничего не найдено.
client.sonka.hotkeys.click = клик
client.sonka.hotkeys.rmb = Правый клик
client.sonka.hotkeys.hold = удерживать
client.sonka.hotkeys.drag = протяжка
client.sonka.hotkeys.line_rotate.key = Колесо / Alt + колесо
client.sonka.hotkeys.unit_letters.name = Выбор типа юнита буквой
client.sonka.hotkeys.unit_letters.desc = Зажми модификатор и нажми букву юнита - в выделении останется только этот тип; Shift выбирает второй юнит буквы, Backspace инвертирует. Буквы подписаны на иконках юнитов, пока зажат модификатор.
client.sonka.hotkeys.control_groups.name = Группы управления
client.sonka.hotkeys.control_groups.desc = Модификатор + цифра запоминает выделенные юниты группой, цифра сама по себе выбирает её; Shift + цифра добавляет к выделению.
client.sonka.hotkeys.best_drill.name = Лучший бур под курсором
client.sonka.hotkeys.best_drill.desc = Средний клик по руде выбирает самый высокий по тиру бур, на который хватает ресурсов ядра (для руды в стенах - лучевой бур).
client.sonka.hotkeys.line_rotate.name = Поворот при протяжке линии
client.sonka.hotkeys.line_rotate.desc = Для настроенных блоков колесо поворачивает весь ряд, а Alt + колесо - только последний блок; остальные блоки ведут себя как в ванили.
client.sonka.hotkeys.menu_regen.name = Перегенерировать фон главного меню
client.sonka.hotkeys.menu_regen.desc = В главном меню, когда не активно ни одно текстовое поле.
client.sonka.hotkeys.join_refresh.name = Обновить список серверов
client.sonka.hotkeys.join_refresh.desc = В окне подключения.
client.sonka.hotkeys.glyph_copy.name = Скопировать иконку как символ для чата
client.sonka.hotkeys.glyph_copy.desc = Shift (или Ctrl) + клик по иконке блока, юнита, предмета или эффекта в базе данных, палитре блоков и диалогах Testing Utilities.
client.sonka.hotkeys.editor_tools.name = Редактор карт: инструменты
client.sonka.hotkeys.editor_tools.desc = 1-9 выбирают инструмент, 0 сбрасывает режим, R поворачивает, E переключает опцию инструмента, стрелки листают блок, Esc снимает выбор.
client.sonka.hotkeys.editor_alt_tools.name = Редактор карт: временный альтернативный инструмент
client.sonka.hotkeys.editor_alt_tools.desc = Пока зажато над картой - альтернативный режим инструмента (Shift) или второй инструмент (Alt).
client.sonka.hotkeys.maptags_delete.name = Удалить тег карты без подтверждения
client.sonka.hotkeys.maptags_delete.desc = Shift + клик по корзине в диалоге тегов карт.
client.sonka.hotkeys.schem_chord.name = Открыть ячейку таблицы схем аккордом
client.sonka.hotkeys.schem_chord.desc = Нажми клавишу-лидер, затем цифру строки, затем цифру столбца (нумпад тоже работает) - выберется схема из этой ячейки.
client.sonka.hotkeys.schem_cell_rmb.name = Таблица схем: настройки ячейки / страницы / вкладки
client.sonka.hotkeys.schem_cell_rmb.desc = Правый клик по ячейке, подписи страницы или вкладке в режиме редактирования открывает её настройки.
client.sonka.hotkeys.he_slots.name = Слоты быстрого инвентаря
client.sonka.hotkeys.he_slots.desc = Цифры 1-8 выбирают слот текущей страницы быстрого инвентаря (страница переключается своей клавишей выше).
client.sonka.hotkeys.tmi_calc_save.name = Калькулятор: сохранить / сохранить как / сохранить всё
client.sonka.hotkeys.tmi_calc_save.desc = Внутри калькулятора производства Too Many Items.
client.sonka.hotkeys.tmi_calc_refresh.name = Калькулятор: пересчитать
client.sonka.hotkeys.tmi_calc_refresh.desc = Внутри калькулятора производства Too Many Items.
client.sonka.hotkeys.autobuild_schem.name = Автостройка схемы
client.sonka.hotkeys.autobuild_schem.desc = Зажми Shift при протяжке с выбранной схемой - она ставится повторно вдоль протяжки.
client.sonka.hotkeys.forcebuild_schem.name = Принудительная стройка схемы
client.sonka.hotkeys.forcebuild_schem.desc = Зажми Ctrl при протяжке с выбранной схемой - она ставится поверх существующих блоков.
client.sonka.hotkeys.copy_anywhere.name = Копировать схему в режиме наблюдателя
client.sonka.hotkeys.copy_anywhere.desc = Обычная клавиша выделения схемы работает и без живого юнита (наблюдатель / после смерти).
client.sonka.hotkeys.pe_undo.name = Редактор патчей: отмена / повтор
client.sonka.hotkeys.pe_nav.name = Редактор патчей: извлечь / править последние данные
