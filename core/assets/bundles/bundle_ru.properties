qol.feature.force-build-schematic.title = Принудительная стройка схемы
setting.qol-force-build-schematic-enabled.name = Включить принудительную стройку схемы
setting.qol-force-build-schematic-enabled.description = Держите Control и кликните ЛКМ при постановке схемы — сначала снесёт свои блоки под ней, потом построит схему.

qol.feature.auto-build-schematic.title = Автостройка схемы
setting.qol-auto-build-schematic-enabled.name = Включить автостройку схемы
setting.qol-auto-build-schematic-enabled.description = Держите Shift и кликните ЛКМ при постановке схемы — её блоки уйдут в общую командную очередь на восстановление, а ЧАСТЬ помощников, сейчас стоящих на assist (масштабируется под размер схемы, сначала ближайшие), переключится на команду "Восстановление" и построит её сама - не нужно самому продолжать строить, чтобы помощники работали.
setting.autobuild-blocks-per-helper.name = Автостройка: блоков на одного помощника
setting.autobuild-blocks-per-helper.description = Сколько блоков схемы оправдывают отправку ещё одного помощника - маленькая схема заберёт одного-двух, большая масштабируется до всех доступных помощников на assist.
setting.qol-autobuild-configure.name = Настроить приоритет юнитов для автостройки
qol.auto-build-schematic.dialog.title = Автостройка
qol.auto-build-schematic.dialog.hint = Какие типы помощников отправлять на автостройку в первую очередь при постановке схемы/линии - медленным типам это выгодно, им не нужно поспевать за тобой, быстрых лучше оставить на assist. Не указанные в списке типы приоритетны в последнюю очередь (дольше остаются на assist).
qol.auto-build-schematic.dialog.priority = Приоритетный список (через запятую, лучший для автостройки первым; неуказанные типы остаются на assist):
qol.auto-build-schematic.dialog.save = Сохранить
qol.auto-build-schematic.queued = Автостройка: {0} блок(ов) в очереди, {1} помощник(ов) переключено на восстановление
qol.auto-build-schematic.mp-unsupported = Автостройка работает только при хостинге или в одиночной игре - общая очередь стройки серверная, клиент не может её пополнить на чужом сервере

qol.feature.erekir-autopower.title = Erekir Auto Power
setting.qol-erekir-autopower-enabled.name = Включить Erekir Auto Power
setting.qol-erekir-autopower-enabled.description = Двойной клик по жерлу на Erekir ставит турбинный конденсатор и подключает его лучевыми узлами к ближайшей энергосети.
erekir-autopower-no-anchor = Не удалось поставить конденсатор на это жерло
erekir-autopower-no-network = Рядом нет энергосети - конденсатор поставлен без связи

qol.feature.buildbeam-color.title = Цвета лучей
setting.qol-buildbeam-color-enabled.name = Включить цвета лучей
setting.qol-buildbeam-color-enabled.description = Перекрашивает лучи в мире в выбранные цвета или переливающуюся радугу: луч стройки/ремонта (а заодно подсветки с тем же цветом движка - ауры щита и разгона/реген-проектора), лечебные лучи юнитов вместе с менд-проекторами и ремонтными турелями, лазеры энергосети и луч копания. Каждый цвет настраивается отдельно; нетронутые остаются ванильными.
setting.buildbeam-color-rainbow.name = Радужный луч стройки
setting.buildbeam-color-gradient.name = Градиент луча стройки (2 цвета)
setting.buildbeam-color-gradient.description = Переливается между двумя выбранными цветами. Если включена и радуга - радуга в приоритете.
setting.buildbeam-color-pick.name = Выбрать цвет луча
setting.buildbeam-color-pick2.name = Выбрать второй цвет градиента (стройка)
setting.buildbeam-color-heal-rainbow.name = Радужные лечебные лучи
setting.buildbeam-color-heal-gradient.name = Градиент лечебных лучей (2 цвета)
setting.buildbeam-color-heal-gradient.description = Переливается между двумя выбранными цветами. Если включена и радуга - радуга в приоритете.
setting.buildbeam-color-heal-pick.name = Выбрать цвет лечебных лучей
setting.buildbeam-color-heal-pick2.name = Выбрать второй цвет градиента (лечение)
setting.buildbeam-color-power-rainbow.name = Радужные лазеры энергосети
setting.buildbeam-color-power-gradient.name = Градиент лазеров энергосети (2 цвета)
setting.buildbeam-color-power-gradient.description = Переливается между двумя выбранными цветами. Если включена и радуга - радуга в приоритете.
setting.buildbeam-color-power-pick.name = Выбрать цвет лазеров энергосети
setting.buildbeam-color-power-pick2.name = Выбрать второй цвет градиента (энергосеть)
setting.buildbeam-color-mine-rainbow.name = Радужный луч копания
setting.buildbeam-color-mine-gradient.name = Градиент луча копания (2 цвета)
setting.buildbeam-color-mine-gradient.description = Переливается между двумя выбранными цветами. Если включена и радуга - радуга в приоритете.
setting.buildbeam-color-mine-pick.name = Выбрать цвет луча копания
setting.buildbeam-color-mine-pick2.name = Выбрать второй цвет градиента (копание)

qol.feature.zoom-display.title = Отображение зума
setting.qol-zoom-display-enabled.name = Включить отображение зума
setting.qol-zoom-display-enabled.description = Показывает текущее приближение мира в виде множителя (например "2x", "0.5x") сверху экрана, пока оно меняется, и плавно исчезает, когда останавливается.

qol.feature.resources-viewer.title = Монитор ресурсов
setting.qol-resources-viewer-enabled.name = Включить монитор ресурсов
setting.qol-resources-viewer-enabled.description = Следит за балансом энергии и ресурсами ядра вражеских команд (предупреждает, когда энергия уходит в минус или отслеживаемый ресурс падает или заканчивается), а также опционально за вашей базой (предупреждает, если ваш ресурс начал резко падать).
qol.resources-viewer.configure = Настройки монитора ресурсов
qol.resources-viewer.quiet = Всё спокойно...
qol.resources-viewer.threshold = Порог
setting.watchOwnResources.name = Также следить за своей базой
setting.watchOwnResources.description = Предупреждает, если энергия в вашей сети уходит в минус, или отслеживаемый ресурс в вашем ядре начал резко падать — по скорости падения, а не по низкому остатку.
setting.spySelfDropThreshold.name = Порог тревоги о резком падении
setting.spySelfDropThreshold.description = Сколько единиц отслеживаемого ресурса должно исчезнуть из вашего ядра примерно за секунду, чтобы это посчиталось "резким падением".
resources-viewer-power-deficit = Энергия в минусе
resources-viewer-per-sec = сек
resources-viewer-zero = ПОЛНЫЙ НУЛЬ
resources-viewer-left = Ост
resources-viewer-alarm = ТРЕВОГА
resources-viewer-dropping-fast = БЫСТРО ПАДАЕТ
resources-viewer-your-base = Ваша база

qol.feature.mine-defaults.title = Руды копки по умолчанию
setting.qol-mine-defaults-enabled.name = Включить Руды копки по умолчанию
setting.qol-mine-defaults-enabled.description = Юнит, получивший команду "копать" (от вас или свежий с завода), автоматически получает настроенный вами набор руд вместо ванильного режима "копать всё подряд". Руды у юнита по-прежнему можно сменить вручную - настройки применяются только в момент выдачи команды.
setting.qol-mine-defaults-configure.name = Настроить руды по умолчанию для типов юнитов
qol.mine-defaults.dialog.title = Руды копки по умолчанию
qol.mine-defaults.dialog.hint = Выберите, какие руды каждый тип юнита копает по умолчанию при получении команды "копать". Типы без выбранных руд не трогаются (ванильное поведение). Ручные изменения руд у юнита сохраняются, пока ему заново не выдадут команду "копать".

qol.feature.core-heal.title = Авто-хил ядра
setting.qol-core-heal-enabled.name = Включить Авто-хил ядра
setting.qol-core-heal-enabled.description = Летающие саппорты (поли, мега, ...) в радиусе от вашего повреждённого ядра бросают свои дела и хилят его: дальние сначала летят к ядру, потом чинят - включая юнитов, которым вы сами дали команду "ремонт", так что ядро для них приоритетнее случайных побитых стен. Прежние команды возвращаются, когда ядро простоит на полном здоровье заданное время.
setting.coreheal-radius.name = Радиус авто-хила ядра
setting.coreheal-radius.description = Насколько близко (в клетках) саппорт должен быть к повреждённому ядру, чтобы сработал авто-хил.
setting.coreheal-restore-delay.name = Возврат к прошлой команде через
setting.coreheal-restore-delay.description = Сколько секунд ядро рядом должно простоять на полном здоровье (не получая урона), прежде чем перенаправленные юниты вернутся к прошлой команде. Защищает от дёрганья юнитов туда-сюда, пока ядро под повторяющейся атакой.
setting.coreheal-manual-hold.name = Приоритет ручных команд
setting.coreheal-manual-hold.description = Сколько секунд после твоей ручной команды юниту (приказ кликом, кнопки/хоткеи команд) авто-хил ядра его не трогает и не отправляет к ядру. 0 = выключено (авто-хил может перехватить и вручную управляемых юнитов).
setting.minedefaults-distribute.name = Распределять копателей по рудам по дефициту в ядре
setting.minedefaults-distribute.description = Вместо того чтобы вся стая паслась на одной самой дефицитной руде (ванильное поведение), настроенные копатели делятся между настроенными рудами пропорционально дефициту в ядре: на самую дефицитную - больше всего юнитов, на остальные - меньше, но хотя бы по одному. Перераспределение идёт постоянно; руды, которых нет на карте или чей склад в ядре полон, юнитов не получают. Ручная смена руд у юнита по-прежнему выводит его из-под управления до повторной команды. Если выключено - прежнее поведение: юнит один раз получает весь настроенный набор руд.
setting.minedefaults-flee.name = Копатели убегают от опасности
setting.minedefaults-flee.description = Копатель, к которому приблизился вооружённый вражеский юнит или который попал в радиус вражеской турели, бросает копку и летит к ближайшему ядру; пробыв несколько секунд вне опасности, сам возвращается к копке.
setting.minedefaults-flee-range.name = Дистанция бегства от вражеских юнитов
setting.minedefaults-flee-range.description = Насколько близко (в клетках) должен подойти вооружённый вражеский юнит, чтобы копатель убежал. Для турелей вместо этого используется их собственный радиус с небольшим запасом.
setting.minedefaults-poly-split.name = Поли делятся: половина копает, половина помогает вам
setting.minedefaults-poly-split.description = Когда поли получают команду "копать", половина из них переключается на помощь вам в стройке (как хоткей F9), при нечётном числе лишний остаётся копать. Баланс половин поддерживается по мере производства и потерь поли; если вручную перекомандовать помогающего поли - он выходит из системы.
setting.minedefaults-abundance-assist.name = Копатели помогают, когда руды много
setting.minedefaults-abundance-assist.description = Копатель, у которого ВСЕ настроенные руды уже почти заполнили ядро (копать сейчас нечего), переключается на помощь в стройке вместо простоя. Как только хоть одна руда снова становится дефицитной, копатель автоматически возвращается к копке. Ручная перекоманда выводит юнита из системы.
setting.minedefaults-abundance-high.name = Помощь при избытке: порог переключения
setting.minedefaults-abundance-high.description = Процент заполнения ядра (по КАЖДОЙ настроенной руде копателя), при котором считается, что руды "достаточно" и можно переключить юнита на помощь вместо копки.
setting.minedefaults-abundance-low.name = Помощь при избытке: порог возврата к копке
setting.minedefaults-abundance-low.description = Процент заполнения ядра, ниже которого руда переключённого копателя должна упасть, чтобы он вернулся к копке. Специально ниже порога переключения, чтобы не было дёрганья туда-сюда на одной границе.
qol.feature.payload-drop.title = Аварийный сброс груза
setting.qol-payload-drop-enabled.name = Включить аварийный сброс груза
setting.qol-payload-drop-enabled.description = Командный носитель (мега, квад, окта, ...) с грузом на борту при падении здоровья ниже порога немедленно выгружает всё прямо на месте - юниты внутри выживают, даже если сам носитель погибнет. После выгрузки возвращается прежняя команда - кроме команд погрузки/цикла перевозки (они бы просто подобрали сброшенный груз обратно): такие юниты просто останавливаются. Один аварийный сброс на один "приступ" низкого здоровья: юнит не трогается снова, пока не подлечится выше порога.
setting.payloaddrop-hp.name = Сбрасывать груз ниже здоровья
setting.payloaddrop-hp.description = Порог здоровья (в процентах), ниже которого гружёный носитель аварийно выгружает груз.
qol.feature.assist-share.title = Раздел помощников
setting.qol-assist-share-enabled.name = Включить раздел помощников
setting.qol-assist-share-enabled.description = Когда в команде двое и больше игроков-строителей, юниты на команде "помогать" делятся между игроками поровну, и каждый закрепляется за своим: пока его игрок строит - юнит помогает ему, а в перерывах паркуется рядом - вместо того чтобы всей толпой бегать к тому, кто последним тронул чертёж (так делает ванильный ассист). Перекомандованный вручную юнит выходит из системы; если игрок в команде один - фича полностью отключается сама. ВАЖНО: фичу должен включать только один игрок в команде, иначе два мода передерутся за одних и тех же юнитов.
setting.assistshare-idle-delay.name = Парковать помощника после простоя игрока
setting.assistshare-idle-delay.description = Сколько секунд после того, как его игрок перестал строить, юнит продолжает помогать, прежде чем припарковаться рядом. Как только игрок снова начинает стройку - юнит сразу возвращается к помощи.
setting.assistshare-manual-hold.name = Приоритет ручных команд
setting.assistshare-manual-hold.description = Сколько секунд после твоей ручной команды юниту (приказ кликом, кнопки/хоткеи команд) Assist Share его не трогает: не паркует и не распределяет. 0 = выключено.
qol.feature.travel-boost.title = Буст в дороге
setting.qol-travel-boost-enabled.name = Включить буст в дороге
setting.qol-travel-boost-enabled.description = Мехи (пульсар, квазар, парус...) с приказом лететь дальше настроенной дистанции взлетают (ванильный стенс буста) на время пути и садятся по прибытии. Приказы атаки не трогаются - мех в полёте не может стрелять. Снимается только буст, включённый самой фичей; выставленный вручную остаётся.
setting.travelboost-distance.name = Бустить при пути дальше чем
setting.travelboost-distance.description = Приказ двигаться в точку дальше этого числа клеток заставляет меха лететь, а не идти пешком.
setting.travelboost-manual-hold.name = Приоритет ручного boost
setting.travelboost-manual-hold.description = Сколько секунд после того, как ты сам переключил юниту stance boost, Travel Boost его не трогает (ни взлёта, ни посадки). 0 = выключено.
qol.feature.conveyor-upgrade.title = Массовый апгрейд конвейеров
setting.qol-conveyor-upgrade-enabled.name = Включить массовый апгрейд конвейеров
setting.qol-conveyor-upgrade-enabled.description = Один хоткей (Управление -> Массовый апгрейд конвейеров, по умолчанию F7) ставит в очередь замену всех обычных конвейеров команды на титановые - через обычную очередь стройки твоего юнита: цена, скорость и помощники работают как с ручной постановкой. Очередь подкачивается порциями, чтобы экран не тонул в тысячах призраков. Повторное нажатие - отмена. Бронированные конвейеры не предлагаются специально: они не принимают боковую подачу и ломают существующие схемы. Ниша - разовый апгрейд всей команды целиком; одну связанную цепочку от клика делает Умный апгрейд, а непрерывный авто-апгрейд - чат-команда !builder u.
keybind.upgrade-conveyors.name = Апгрейд всех конвейеров
category.conveyor-upgrade.name = Массовый апгрейд конвейеров
qol.conveyor-upgrade.start = Апгрейд конвейеров: {0} в очереди
qol.conveyor-upgrade.none = Обычных конвейеров не найдено
qol.conveyor-upgrade.cancel = Апгрейд конвейеров отменён
qol.conveyor-upgrade.done = Апгрейд конвейеров завершён
qol.feature.resource-forecast.title = Прогноз ресурсов
setting.qol-resource-forecast-enabled.name = Включить прогноз ресурсов
setting.qol-resource-forecast-enabled.description = HUD-панель с прогнозом ресурсов своего ядра: по каждому предмету сглаженная скорость прихода/расхода и время - "-> 0 0:45" для убывающего (самые срочные сверху), "-> full 2:10" для прибывающего. Видно, что кремний кончится, за минуты до тоста OUT-OF.
qol.resource-forecast.quiet = Заметных изменений нет...
qol.feature.schematic-sanitizer.title = Санация схем
setting.qol-schematic-sanitizer-enabled.name = Включить санацию схем
setting.qol-schematic-sanitizer-enabled.description = Вычищает битые тайлы (с null-блоком) из схем в библиотеке - при загрузке игры и при каждом открытии диалога схем. Такие тайлы порождают кривые моды, а клиент foo падает от них при первой же отрисовке диалога. Тост показывает имена вычищенных схем - так можно вычислить мод, который их плодит.
qol.schematic-sanitizer.cleaned = Санация схем: удалено битых тайлов: {0} - в схемах: {1}

qol.feature.quick-toggles.title = Быстрые переключатели
setting.qol-quick-toggles-enabled.name = Включить быстрые переключатели
setting.qol-quick-toggles-enabled.description = Две перетаскиваемые HUD-кнопки: блокировка камеры замораживает юнита на месте, чтобы можно было свободно двигать камеру, и пауза стройки - переключаемая версия зажимаемой клавиши "пауза стройки" из ванильной игры.

qol.feature.auto-possess.title = Автозахват юнита
setting.qol-auto-possess-enabled.name = Включить автозахват юнита
setting.qol-auto-possess-enabled.description = Автоматически берёт под управление юнита, как только он освобождается: либо конкретный настроенный тип, либо лучший по приоритетному списку тип, если текущий юнит его не превосходит. Настройка ниже.
setting.qol-auto-possess-configure.name = Настроить автозахват
qol.auto-possess.dialog.title = Автозахват юнита
qol.auto-possess.dialog.hint = Оставьте цель пустой, чтобы использовать только приоритетный список. Если задано и то и другое, точная цель имеет приоритет.
qol.auto-possess.dialog.target = Тип юнита-цели (точное имя, пусто = не используется):
qol.auto-possess.dialog.priority = Приоритетный список (через запятую, лучший первым):
qol.auto-possess.dialog.save = Сохранить
qol.auto-possess.possessed = Автозахват: {0}

qol.feature.quick-chat.title = Быстрый чат
setting.qol-quick-chat-enabled.name = Включить быстрый чат
setting.qol-quick-chat-enabled.description = Перетаскиваемая HUD-кнопка со списком своих чат-сообщений, отправляемых в один тап. Первый слот, Auto-Execute, может отправить свой текст автоматически вскоре после захода в мир.
qol.quick-chat.title = Быстрый чат
qol.quick-chat.crash-disabled = Auto-Execute отключён, потому что игра вылетела или закрылась во время последнего выполнения.
qol.quick-chat.add = Добавить сообщение
qol.quick-chat.dialog.delete-title = Удалить сообщение
qol.quick-chat.dialog.delete-confirm = Точно удалить '{0}'?
qol.quick-chat.dialog.add = Добавить сообщение
qol.quick-chat.dialog.edit = Изменить сообщение
qol.quick-chat.dialog.name = Название:
qol.quick-chat.dialog.text = Текст:
qol.quick-chat.dialog.cancel = Отмена
qol.quick-chat.dialog.ok = ОК
qol.quick-chat.dialog.name-required = Название не может быть пустым.

qol.feature.custom-binds.title = Свои экранные кнопки
setting.qol-custom-binds-enabled.name = Включить свои экранные кнопки
setting.qol-custom-binds-enabled.description = Перетаскиваемые кнопки на экране, которые вы настраиваете сами - каждая отправляет свои чат-команды/сообщения. Настройка ниже; заблокируйте позиции, чтобы не сдвинуть их случайно после настройки.
setting.qol-cbinds-locked.name = Заблокировать позиции кнопок
setting.qol-custom-binds-configure.name = Настроить свои экранные кнопки
qol.custom-binds.title = Свои экранные кнопки
qol.custom-binds.lock = Заблокировать позиции (отключить перетаскивание)
qol.custom-binds.delete-title = Удалить кнопку
qol.custom-binds.delete-confirm = Точно удалить '{0}'?
qol.custom-binds.add = Добавить кнопку
qol.custom-binds.dialog.add = Добавить кнопку
qol.custom-binds.dialog.edit = Изменить кнопку
qol.custom-binds.dialog.name = Подпись:
qol.custom-binds.dialog.icon = Имя иконки (блок/предмет/жидкость/юнит/иконка интерфейса):
qol.custom-binds.dialog.icon-type = Подсказка типа иконки (Block/Item/Liquid/Unit, необязательно):
qol.custom-binds.dialog.size = Размер (Ш x В):
qol.custom-binds.dialog.no-background = Без фона
qol.custom-binds.dialog.commands = Команды/сообщения (по одному на строку):
qol.custom-binds.dialog.cancel = Отмена
qol.custom-binds.dialog.ok = ОК
qol.custom-binds.dialog.needs-content = У кнопки должна быть подпись или иконка.


qol.feature.crawler-control.title = Контроль ползунов
setting.qol-crawler-control-enabled.name = Включить контроль ползунов
setting.qol-crawler-control-enabled.description = Заданные командой ползуны держат самоподрыв, пока бегут к цели (не взрываются на первом встречном враге по пути), и снимают удержание сразу по прибытии, взрываясь как обычно. Ползуны на стандартном ИИ (без команды) не трогаются.

qol.feature.copy-anywhere.title = Копирование везде
setting.qol-copy-anywhere-enabled.name = Включить копирование везде
setting.qol-copy-anywhere-enabled.description = Позволяет выделить область и сохранить её как схему даже в режиме наблюдения (без юнита под контролем) - зажмите клавишу выделения схемы (по умолчанию F, перепривязывается в Управлении) и потяните по уже построенным тайлам, как обычно, затем отпустите, чтобы назвать и сохранить. Ванильная игра даёт этот жест только когда у вас есть юнит.

