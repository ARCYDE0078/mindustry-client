# sonka: гранулярный экспорт/импорт данных (sonkaextras.dataio)
client.setting.sonka-dataio-export.name = Экспорт данных (по категориям)...
client.setting.sonka-dataio-export.description = Экспортировать отдельно схемы, карты, моды, сейвы кампании, обычные сейвы, прогресс кампании или настройки в zip той же структуры, что и ванильный экспорт данных (ванильный импорт его тоже понимает). Ванильные кнопки в «Данные игры» не тронуты.
client.setting.sonka-dataio-import.name = Импорт данных (по категориям)...
client.setting.sonka-dataio-import.description = Импортировать выбранные категории из нашего zip или ванильного экспорта данных. Ничего не удаляет; без «перезаписи» одноимённые файлы пропускаются (схемы дедупятся по имени и содержимому), с перезаписью сначала делается автобэкап категории в папку backups.
client.sonka.dataio.export.title = Экспорт данных...
client.sonka.dataio.export.hint = Выбери, что положить в zip. Структура архива - как у ванильного экспорта данных, плюс манифест custom-export.json: импортируется и здесь, и ванильным «Импортом данных» (который, как всегда, заменяет всё).
client.sonka.dataio.export.go = Экспорт
client.sonka.dataio.export.done = Экспортировано: {0}
client.sonka.dataio.export.fail = Экспорт не удался
client.sonka.dataio.import.title = Импорт данных...
client.sonka.dataio.import.go = Импорт
client.sonka.dataio.import.fail = Импорт не удался
client.sonka.dataio.import.empty = В архиве нет ничего импортируемого (ни схем/карт/модов/сейвов/настроек).
client.sonka.dataio.import.vanilla = Ванильный экспорт данных (без манифеста) - категории определены по путям.
client.sonka.dataio.import.manifest = Наш экспорт от {0}, билд игры {1}.
client.sonka.dataio.import.rejected = Отвергнуто записей: {0} (небезопасные пути).
client.sonka.dataio.import.overwrite = Перезаписывать существующие
client.sonka.dataio.import.overwrite.desc = Выкл (по умолчанию): мерж без затирания - одноимённый файл пропускается, схемы дедупятся по имени и содержимому, обычные сейвы получают следующий свободный слот, из настроек добавляются только отсутствующие ключи. Вкл: одноимённые файлы и ключи заменяются, прогресс кампании заменяется целиком. Перед этим в папку backups каталога данных игры пишется бэкап-zip каждой затронутой категории.
client.sonka.dataio.import.overwrite.confirm = Режим перезаписи: одноимённые файлы и настройки будут заменены (бэкапы затронутых категорий сначала сохраняются в папку backups). Продолжить?
client.sonka.dataio.nothing = Ничего не выбрано.
client.sonka.dataio.menuonly = Прогресс кампании импортируется только из главного меню.
client.sonka.dataio.backupfail = Бэкап «{0}» не удался: {1}
client.sonka.dataio.result.title = Импорт завершён
client.sonka.dataio.result.summary = Импортировано: [accent]{0}[], заменено: [orange]{1}[], пропущено: [gray]{2}[]
client.sonka.dataio.result.backups = Записаны бэкапы (каталог данных игры, backups/):
client.sonka.dataio.result.errors = Ошибки:
client.sonka.dataio.result.restart = Часть импортированного (моды, прогресс кампании, настройки) полностью применится только после перезапуска.
client.sonka.dataio.restart.now = Перезапустить сейчас
client.sonka.dataio.cat.schematics = Схемы
client.sonka.dataio.cat.schematics.desc = schematics/*.msch - твои схемы (без встроенных в моды).
client.sonka.dataio.cat.maps = Карты
client.sonka.dataio.cat.maps.desc = maps/*.msav - пользовательские карты (плюс кэш ассетов карт с картинками).
client.sonka.dataio.cat.mods = Моды
client.sonka.dataio.cat.mods.desc = mods/ - файлы и папки установленных модов. Импорт требует перезапуска; включённость модов хранится в настройках.
client.sonka.dataio.cat.campaignSaves = Сейвы кампании (секторы)
client.sonka.dataio.cat.campaignSaves.desc = saves/sector-*.msav и снапшоты волн - сохранения секторов кампании. Без «прогресса кампании» секторы загрузятся, но исследования, анлоки и инфо секторов (захват, ресурсы, производство) останутся локальными.
client.sonka.dataio.cat.saves = Обычные сейвы
client.sonka.dataio.cat.saves.desc = saves/<n>.msav - сохранения обычных игр вместе с именами.
client.sonka.dataio.cat.campaignProgress = Прогресс кампании (исследования, секторы)
client.sonka.dataio.cat.campaignProgress.desc = Кампанейская часть settings.bin: анлоки (*-unlocked), вложенные в исследования ресурсы (req-*), инфо секторов (<планета>-s-<id>-info), правила и статистика кампании планет, время вселенной, лоадауты, последний сектор. Хранится как campaign-progress.json и внутри settings.bin. С «перезаписью» заменяет локальный прогресс целиком; импорт только из главного меню, затем перезапуск.
client.sonka.dataio.cat.settings = Настройки
client.sonka.dataio.cat.settings.desc = Остальной settings.bin: графика, управление, опции клиента и модов. Без прогресса кампании, имён сейвов и идентичности игрока (uuid/usid).

# sonka: профили кампании (sonkaextras.campaign)
client.setting.sonka-campaign-profiles.name = Профили кампании...
client.setting.sonka-campaign-profiles.description = Несколько независимых кампаний с переключением (например, мод, полностью меняющий кампанию, без потери основного сейва). Активный профиль живёт на штатных местах, неактивные - в папке campaigns каталога данных игры. Переключение делает полный бэкап и перезапускает игру.
client.sonka.campaign.title = Профили кампании
client.sonka.campaign.hint = Каждый профиль - независимая кампания: сейвы секторов плюс исследования, анлоки, инфо секторов и время вселенной. Активный профиль живёт на штатных местах (saves/ + настройки); переключение убирает текущую кампанию в её папку, возвращает другую и [accent]перезапускает игру[]. Перед каждым переключением полный бэкап-zip текущей кампании пишется в backups/ каталога данных игры; удаление профиля тоже оставляет там бэкап-zip.
client.sonka.campaign.default = Основная
client.sonka.freecam = Свободная камера
client.sonka.freecam.hint = Свободная камера: перетаскивание - осмотр, WASD - полёт, E/Q - вверх/вниз, колесо - вперёд/назад, Shift - быстрее
client.sonka.campaign.active = активный
client.sonka.campaign.empty = пустая кампания (новая игра)
client.sonka.campaign.details = Секторов: {0}  |  Планеты: {1}  |  Последняя игра: {2}
client.sonka.campaign.menuonly = Профили кампании переключаются только из главного меню (не в игре и не в сети).
client.sonka.campaign.name = Имя профиля
client.sonka.campaign.new = Новый пустой профиль
client.sonka.campaign.import = Импорт профиля из zip...
client.sonka.campaign.import.done = Профиль импортирован.
client.sonka.campaign.import.fail = Импорт профиля не удался
client.sonka.campaign.import.nocampaign = В этом архиве нет ни сейвов кампании, ни прогресса кампании.
client.sonka.campaign.folder = Папка профилей
