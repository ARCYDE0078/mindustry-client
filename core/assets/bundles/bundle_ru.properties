client.sonka.cursors.editor = Пиксельный редактор
client.sonka.cursors.editor.title = Редактор курсора: {0}
client.sonka.cursors.editor.save = Сохранить и применить
client.sonka.cursors.editor.saved = Курсор сохранён и применён.
client.sonka.cursors.editor.savefail = Не удалось сохранить курсор
client.sonka.cursors.editor.preview = Превью: 1:1 / с размером и тинтом
client.sonka.cursors.editor.size = Размер холста
client.sonka.cursors.editor.color = Цвет рисования...
client.sonka.cursors.editor.hint = Левая кнопка рисует выбранным инструментом. Инструмент [accent]хотспот[] задаёт точку клика курсора (крестик; по умолчанию центр, как у ванили). Смена размера холста пересэмплирует рисунок. Закрытие без «Сохранить и применить» отменяет изменения.
client.sonka.cursors.editor.hotspot.reset = Сбросить хотспот в центр
