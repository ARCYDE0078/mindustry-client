client.sonka.campaign.startup.mismatch = Рассинхрон профилей кампании: файлы на диске принадлежат профилю «{0}», а настройки говорят «{1}». Скорее всего, файл настроек при последнем переключении восстановился из старой копии. НЕ играй в кампанию, пока не разберёшься: переключись заново на нужный профиль или импортируй последний бэкап кампании из\n{2}\nЕсли данные заменялись намеренно (ванильный импорт данных и т.п.) - просто укажи, какой профиль сейчас на диске.
