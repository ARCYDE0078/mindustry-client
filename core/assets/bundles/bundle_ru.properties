client.sonka.report.copy = Скопировать в буфер
client.sonka.report.save = Сохранить как...
client.sonka.report.write = Записать в папку данных
client.sonka.report.copied = Отчёт скопирован в буфер (и записан в monolith-report.txt в папке данных)
client.sonka.report.written = Отчёт записан в {0}
client.sonka.report.failed = Не удалось записать отчёт (см. лог)
client.sonka.whatsnew.title = Что нового в Monolith
