client.sonka.hotkeys.pe_node.name = Редактор патчей: быстрое действие узла
client.sonka.hotkeys.pe_node.desc = Средний клик по карточке узла.
client.sonka.hotkeys.ee_esc.name = Extra Editor: отмена
client.sonka.hotkeys.ee_esc.desc = Снимает текущее выделение, закрывает всплывающие опции и сбрасывает режим инструмента.
client.sonka.hotkeys.qolc_bind.desc = Пользовательский бинд чата/команды (QoL Control). Выполняет текст построчно как сообщения чата или команды клиента.
client.sonka.hotkeys.qolc_none.name = Бинды чата/команд
client.sonka.hotkeys.qolc_none.desc = Биндов пока нет. «Настроить» позволяет повесить на любую комбинацию клавиш сообщение чата или команду клиента.
