control-helper-automine = Вкл/выкл авто-добычу, когда не строишь (то же самое, что настройка "Авто-добыча, когда не строишь")
control-helper-reconnect-power = Подключить отделившиеся сети питания к основной - кнопочная, щадящая по рейт-лимиту альтернатива чат-команде !fixpower (та соединяет все сети разом через конфиги)
qol.power-reconnect.done = Переподключение сети: поставлено связей - {0}
qol.power-reconnect.none = Отделившихся сетей питания не найдено
keybind.connect_power_networks.name = Подключить сеть питания к ближайшей другой сети
setting.powerBridgeBuilder.name = Подключить сеть питания к ближайшей другой сети (по клавише)
setting.powerBridgeBuilder.description = По нажатию клавиши связывает вашу ближайшую сеть питания со следующей по близости - настраивает существующий узел в радиусе, если это возможно, иначе ставит в очередь стройки цепочку новых узлов питания, прокладывающую путь между ними.
qol.power-bridge.none = Больше нет сетей питания для подключения
qol.power-bridge.linked = Подключено через существующий узел
qol.power-bridge.queued = Мост питания: поставлено новых узлов - {0}
qol.power-bridge.blocked = Нет свободного места для новых узлов между этими сетями

