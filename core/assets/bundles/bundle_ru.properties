setting.prioritizePlans.name = Приоритизировать план построек
setting.handMiner.name = Держать клавишу "пауза стройки" для ручной добычи
setting.ignoreSupportUnits.name = Выбирать все юниты 2 раза, чтобы игнорировать саппортов
setting.highlightDisconnectedPower.name = Подсветить постройки не в основной сети
setting.highlightDisconnectedPower.description = Обводит любой силовой узел или потребляющую/производящую энергию постройку вашей команды, которая не входит в самую большую энергосеть — обычно значит, что она выглядит подключённой, но на деле не связана.
