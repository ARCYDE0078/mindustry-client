# sonkaextras: уведомление о незапитанном начале протянутой цепочки труб/конвейеров (ChainWarn)
client.setting.sonka-chain-warn.name = Warn about unfed transport lines
client.setting.sonka-chain-warn.description = After a dragged conveyor/duct/conduit line finishes building, warns (clickable toast + blinking marker) if nothing feeds its input end - no source building, no transit behind a junction, and no queued build plan
client.setting.sonka-chain-warn-end.name = Also check the line's output end
client.setting.sonka-chain-warn-end.description = Additionally warn when the line's last segment outputs into nothing (off by default - noisy when building toward a consumer you haven't placed yet)
client.setting.sonka-chain-warn-end-configure.name = Output warning blocks...
client.setting.sonka-chain-warn-end-configure.description = Pick which conveyor/duct/conduit types trigger the output-end warning. Lines of unselected blocks stay silent. Default: all
client.sonka.chainwarn.filter.title = Output warning blocks
client.sonka.chainwarn.filter.hint = The [accent]output-end[] warning fires only for lines built of the blocks selected below. The input-end check is not affected by this filter.
client.sonka.chainwarn.start = [scarlet]Unfed line:[] nothing outputs into its start at ({0}, {1})
client.sonka.chainwarn.end = [scarlet]Dead-end line:[] its output at ({0}, {1}) leads nowhere

# sonkaextras: инверсия роли Alt при повороте протягиваемой линии колесом (LineRotate)
client.setting.sonka-linerotate-configure.name = Line rotation blocks...
client.setting.sonka-linerotate-configure.description = Pick blocks for which the scroll wheel while dragging a line rotates the WHOLE row without Alt, and Alt+wheel rotates only the last block (inverted from the usual behavior). Default: Erekir duct/conduit bridges
client.sonka.linerotate.title = Line rotation blocks
client.sonka.linerotate.hint = For the blocks selected below, while dragging a line: the scroll wheel rotates the [accent]whole row[], and [accent]Alt+wheel[] rotates only the [accent]last block[] (handy for turning a bridge tail sideways). Unselected blocks keep the usual behavior.
client.sonka.linerotate.default = Default (Erekir bridges)
client.sonka.linerotate.all = All
client.sonka.linerotate.none = None

# sonkaextras: рестарт сектора / повтор волны в меню паузы кампании (CampaignRetry)
client.sonka.restartsector = Restart sector
client.sonka.restartsector.tooltip = Reset this sector and land on it again from scratch with your last loadout.
client.sonka.restartsector.confirm = Restart this sector from scratch?\nIts save will be deleted and you will land again with your last loadout. This cannot be undone.
client.sonka.replaywave = Replay wave
client.sonka.replaywave.tooltip = Load the automatic snapshot taken when the current wave started.
client.setting.sonka-wave-autosave.name = Wave-start autosave (Replay wave)
client.setting.sonka-wave-autosave.description = In campaign, snapshots the game at the start of every wave (one rolling snapshot per sector, kept out of the save list) so the pause menu's "Replay wave" button can load it. Turn off if the save causes a noticeable hitch when a wave spawns.
client.setting.sonka-lastcontroller.name = Last controller tag over units
client.setting.sonka-lastcontroller.description = Shows a faded "↺ Name" tag over units a player commanded (RTS orders, command changes) or took control of, and keeps it afterwards - you can see who moved those units. Hidden while a unit is actively controlled (the live name is shown then).
client.setting.sonka-lastcontroller-self.name = Show my own tags
client.setting.sonka-lastcontroller-self.description = Also tag units you commanded yourself. On other people's servers your own orders are never tagged anyway (the server doesn't echo them back).
client.setting.sonka-lastcontroller-timeout.name = Last controller tag lifetime
client.setting.sonka-lastcontroller-timeout.description = How long the tag stays after the player released the unit. 0 = as long as the unit lives.
client.sonka.lastcontroller.forever = while alive
client.sonka.report.title = Bug report log
client.sonka.report.hint = Gathers everything needed to investigate a bug in one text: Monolith and engine versions, OS/Java/GPU, external mods, settings (without secrets such as usid/uuid/keys), the latest crash files and the tail of last_log.txt. "Copy" puts a trimmed version into the clipboard and also writes the full one to the data folder.
