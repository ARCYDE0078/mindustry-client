client.setting.betterenemyblocktapping.name = Better Enemy Block Tapping
client.setting.betterenemyblocktapping.description = Disables tapping on enemy blocks when in a foreshadow, ripple, or arc.
client.setting.autoohno.name = Auto ohno
client.setting.autoohno.description = Spams /ohno when joining a Fish server.
