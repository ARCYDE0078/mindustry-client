setting.bridgetocore-min-turn-distance.description = The pathfinder's first attempt outright refuses to place a turn any closer to the core than this. If that's impossible given the obstacles, it automatically falls back to a route that may turn closer.
setting.bridgetocore-search-padding.name = Search padding
setting.bridgetocore-search-padding.description = How far past the start/end points (in tiles) the pathfinder is willing to search around obstacles. Higher handles bigger detours on cluttered bases but searches more tiles, so it's slower.
setting.bridgetocore-corner-penalty.name = Core corner penalty
setting.bridgetocore-corner-penalty.description = How strongly the pathfinder avoids approaching the core at a corner of its footprint instead of the middle of a side.
setting.bridgetocore-center-priority.name = Core center priority
setting.bridgetocore-center-priority.description = How strongly the pathfinder prefers an approach tile centered on the core's side over one nearer a corner, relative to how much extra travel distance that costs.

