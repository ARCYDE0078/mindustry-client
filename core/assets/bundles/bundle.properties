setting.eui-SchemTableAutoIcons.name = Auto icons from schematic contents
setting.eui-SchemTableAutoIcons.desc = Cells with a schematic but no hand-picked icons show up to 4 of its most significant blocks (by count x footprint): factories, drills, unit factories, turrets... Conveyors, conduits, bridges, unloaders, power nodes and walls are ignored. Nothing is written to the save - picking any icon by hand always wins
