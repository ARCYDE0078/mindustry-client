# sonka: campaign profiles (sonkaextras.campaign)
client.setting.sonka-campaign-profiles.name = Campaign profiles...
client.setting.sonka-campaign-profiles.description = Several independent campaigns with switching (e.g. a mod that overhauls the campaign without losing your main save). The active profile lives in the standard places, inactive ones in the campaigns folder of the game data directory. Switching makes a full backup and restarts the game.
client.sonka.campaign.title = Campaign profiles
client.sonka.campaign.hint = Each profile is an independent campaign: sector saves plus research, unlocks, sector info and universe time. The active profile lives in the usual places (saves/ + settings); switching moves the current campaign into its own folder, brings the other one back and [accent]restarts the game[]. Before every switch a full backup zip of the current campaign is written into backups/ in the game data directory; deleting a profile also leaves a backup zip there.
