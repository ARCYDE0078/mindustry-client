client.setting.showhiddenresources.name = Show all resources in selectors
client.setting.showhiddenresources.description = Lets you pick any item or liquid (even hidden or locked) in sorters, sources, unloaders etc.
client.setting.uselocalizedname.name = Use localized name for search
client.setting.uselocalizedname.description = If this is disabled, specify items/blocks/units with their unlocalized name (eg blast-drill, surge-alloy)

