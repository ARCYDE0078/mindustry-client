qol.feature.crawler-control.title = Crawler Control
setting.qol-crawler-control-enabled.name = Enable Crawler Control
setting.qol-crawler-control-enabled.description = Commanded crawlers hold their self-destruct while travelling to a move/attack order, instead of detonating on the first enemy they pass on the way, and release it the instant they arrive so they blow up normally. Crawlers left on their default AI (never commanded) are untouched.

qol.feature.copy-anywhere.title = Copy Anywhere
setting.qol-copy-anywhere-enabled.name = Enable Copy Anywhere
setting.qol-copy-anywhere-enabled.description = Lets you select an area and save it as a schematic while spectating (no controllable unit) - hold the schematic-select key (F by default, rebindable in Controls) and drag over built tiles, same gesture as normal, then release to name and save it. Vanilla only offers this gesture while you have a unit.

