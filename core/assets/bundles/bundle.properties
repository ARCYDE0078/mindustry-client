setting.qol-custom-binds-enabled.name = Enable Custom Screen Binds
setting.qol-custom-binds-enabled.description = Draggable on-screen buttons you define yourself, each firing its own chat commands/messages. Configure below; lock positions to stop accidental dragging once you're happy with the layout.
