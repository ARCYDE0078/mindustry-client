client.boot.profile.custom = Custom
client.boot.profile.all = All
client.boot.profile.all.desc = Everything loads.
client.boot.profile.campaign = Campaign / PvE
client.boot.profile.campaign.desc = Without editor packages, sandbox tools and the extra console.
client.boot.profile.pvp = PvP
client.boot.profile.pvp.desc = Also without recipe browser, MindustryTool integrations and campaign stats: lighter and less distracting.
client.boot.profile.editor = Map editor
client.boot.profile.editor.desc = Editor packages and sandbox tools; no gameplay automation/analytics packages.
client.boot.profile.minimal = Minimal
