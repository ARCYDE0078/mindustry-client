rules.hidespawns.info = If enabled, enemy spawn points are hidden while browsing the map.\nWhen shown, the circle radius on the map is the exact spawn radius. They are never shown on the minimap.
rules.pvpautopause.info = Pause PvP games in multiplayer if there's only 1 player on server.
rules.unitpayloadupdate.info = If enabled, payloads picked up by a unit will update inside this unit. For example, turrets picked up by unit will shoot in flight.\nWith this option enabled, power will be distributed between buildings inside the same unit. However, it's impossible to add more items into these buildings.
rules.possessionallowed.info = If disabled, players can't get into units and blocks.
rules.ghostblocks.info = If disabled, destroyed buildings won't appear as "ghost" blocks and won't be added to rebuild plan.
rules.dragmultiplier.info = Drag multiplier of the environment. Units lose speed faster if this value is higher than a default one.\nIf set to 0, units won't lose speed at all (space-like environment).
rules.staticfog.info = Static fog of war is completely black yet undiscovered areas.\nIf disabled, only dynamic semi-transparent fog will remain on the map.
rules.cloudscolor.info = Color of clouds during core landing animation.
rules.borderdarkness.info = If enabled, area outside the map border will be darkened with static fog color.\nDisabling this has a good use in space-themed maps.
rules.disableoutsidearea.info = Whether to disable blocks outside map border.
rules.cheat.info = If enabled, team buildings will have necessary resources auto-generated.
rules.coresspawnships.info = If enabled, core default ships will spawn.\nWorks only in teams with RTS AI / Base Builder AI.
rules.modename.info = Name of game mode that is being displayed in server list next to map name in format:\n<MapName> / <ModeName>
rules.mission.info = Mission text displayed in upper right corner of screen instead of wave/core counter. Leave empty to disable.\nHowever, "\\n" doesn't work here, better try using objectives or world processors to set this value.
rules.planetbackground.info = Modify map's planet background parameters.\nThis planet background is displayed over "Empty" tiles while playing the map. Has a good use in space-themed maps.

