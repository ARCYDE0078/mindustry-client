client.sonka.dataio.cat.campaignProgress.desc = The campaign part of settings.bin: unlocks (*-unlocked), research resources (req-*), sector info (<planet>-s-<id>-info), campaign rules and stats of planets, universe time, loadouts, last sector. Stored as campaign-progress.json and inside settings.bin. With "overwrite" it replaces the local progress entirely; import only from the main menu, then restart.
