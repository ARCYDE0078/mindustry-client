setting.qol-quick-chat-enabled.name = Enable Quick Chat
setting.qol-quick-chat-enabled.description = A draggable HUD button opening a list of custom chat messages you can fire with one tap. The first slot, Auto-Execute, can send its text automatically a moment after joining a world.
