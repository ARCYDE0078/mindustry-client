patch-editor.editProgress = Progress Script
patch-editor.editProgress.script = Script
patch-editor.editProgress.defaultHint = Tip: This is the built-in default script, not the progress script of the current field. Click the [accent]Tutorial[] button to learn the script syntax.
patch-editor.editProgress.tutorial = Tutorial

patch-editor.editProgress.tutorial.title = Progress Script Tutorial

patch-editor.editProgress.tutorial.section.1.title = 1. What Is a Progress Script?
patch-editor.editProgress.tutorial.section.1.text.1 = A progress script is a single expression. It starts with [accent]build(...)[], then chains transformation functions to produce a [accent]progress[]: a value (usually 0~1) computed from the part's parameters (PartParams), driving animations, offsets, opacity and more.
patch-editor.editProgress.tutorial.section.1.text.2 = The script is evaluated live: the preview above plays the resulting curve. If the script has errors, the message appears in the red error bar and [accent]OK[] is disabled.

patch-editor.editProgress.tutorial.section.2.title = 2. The build Function
patch-editor.editProgress.tutorial.section.2.text.1 = build is the entry point of every script. It creates a progress in one of these forms:
patch-editor.editProgress.tutorial.build.1.params = progress: a built-in PartProgress variable (e.g. warmup, heat, reload...)
patch-editor.editProgress.tutorial.build.1.desc = Use a built-in progress as the base.
patch-editor.editProgress.tutorial.build.2.params = number: a number (e.g. 0.5)
patch-editor.editProgress.tutorial.build.2.desc = Creates a constant progress.
patch-editor.editProgress.tutorial.build.3.params = progress: a PartProgress variable; interp: an Interp variable
patch-editor.editProgress.tutorial.build.3.desc = Same as build(progress).curve(interp).

patch-editor.editProgress.tutorial.section.3.title = 3. Chainable Functions
patch-editor.editProgress.tutorial.section.3.text.1 = The value returned by build(...) can keep chaining the functions below - each returns a new progress, so they can be combined freely.

patch-editor.editProgress.tutorial.op.group.basic = No Parameters
patch-editor.editProgress.tutorial.op.group.number = Numeric Parameters (float)
patch-editor.editProgress.tutorial.op.group.progress = Progress Parameters (PartProgress)
patch-editor.editProgress.tutorial.op.group.interp = Interp Parameter

patch-editor.editProgress.tutorial.section.4.title = 4. Built-in Variables
patch-editor.editProgress.tutorial.section.4.text.1 = The following variables are built into the script scope and can be used directly in build(...) and the functions above.

patch-editor.editProgress.tutorial.var.group.progress = PartProgress Variables
patch-editor.editProgress.tutorial.var.group.interp = Interp Variables
patch-editor.editProgress.tutorial.var.copy = Click to Copy

