client.boot.title = Components at startup
client.boot.hint = Choose which built-in components load when the game starts. Unchecked ones are not loaded at all: faster start, less memory, no UI from them. Scheme Size and the core extras are always on.
client.boot.restart = Takes effect after restarting the game.
client.boot.reset = Enable all
client.boot.open = Choose components
