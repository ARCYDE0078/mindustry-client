# sonka: granular data export/import (sonkaextras.dataio)
client.setting.sonka-dataio-export.name = Export data (by category)...
client.setting.sonka-dataio-export.description = Export schematics, maps, mods, campaign saves, regular saves, campaign progress or settings separately into a zip of the same layout as the vanilla data export (the vanilla importer understands it too). Vanilla export/import buttons in "Game Data" are untouched.
client.setting.sonka-dataio-import.name = Import data (by category)...
client.setting.sonka-dataio-import.description = Import selected categories from our zip or a vanilla data export. Never deletes existing files; without "overwrite" existing files are skipped (schematics are deduplicated by name and content), overwriting makes an automatic backup of the category into the backups folder first.
client.sonka.dataio.export.title = Export data...
client.sonka.dataio.export.hint = Pick what to put into the zip. The archive uses the vanilla data-export layout plus a custom-export.json manifest, so it can be imported both here and by the vanilla "Import data" (which, as always, replaces everything).
client.sonka.dataio.export.go = Export
client.sonka.dataio.export.done = Exported: {0}
client.sonka.dataio.export.fail = Export failed
client.sonka.dataio.import.title = Import data...
client.sonka.dataio.import.go = Import
client.sonka.dataio.import.fail = Import failed
client.sonka.dataio.import.empty = Nothing importable found in this archive (no schematics/maps/mods/saves/settings).
client.sonka.dataio.import.vanilla = Vanilla data export (no manifest) - categories detected by paths.
client.sonka.dataio.import.manifest = Custom export of {0}, game build {1}.
client.sonka.dataio.import.rejected = {0} entries rejected (unsafe paths).
client.sonka.dataio.import.overwrite = Overwrite existing
client.sonka.dataio.import.overwrite.desc = Off (default): merge without clobbering - a file with the same name is skipped, schematics are deduplicated by name and content, regular saves get the next free slot, only missing settings keys are added. On: same-name files and keys are replaced; campaign progress is replaced as a whole. A backup zip of every affected category is written into the backups folder of the game data directory first.
client.sonka.dataio.import.overwrite.confirm = Overwrite mode: existing files and settings with the same names will be replaced (backups of the affected categories are saved into the backups folder first). Continue?
