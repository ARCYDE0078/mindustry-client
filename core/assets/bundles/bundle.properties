client.setting.sonka-maptags-manage.description = Rename or delete map tags everywhere at once. The same dialog also opens from the pencil button next to the tag filter in the map list. Tags themselves are added per-map from that list (the pencil icon on each map card).
client.setting.sonka-hotkeys-open.name = All hotkeys...
client.setting.sonka-hotkeys-open.description = One searchable list of every hotkey of the client and all baked-in mods, grouped by package, with conflict highlighting. Also opens from the Monolith submenu of the main menu and with its own key (see Controls).
client.setting.sonka-diag-report.name = Bug report log...
client.setting.sonka-diag-report.description = Copy or save a diagnostic report: versions, OS/GPU, external mods, settings without secrets, latest crashes and the log tail.
client.setting.monolith-whatsnew-auto.name = Show "what's new" after an update
client.setting.monolith-whatsnew-auto.description = Once after each client update, show the release notes of the builds installed since the previous one (fetched from GitHub).
client.setting.sonka-whatsnew-history.name = Monolith releases...
client.setting.sonka-whatsnew-history.description = Release notes of every Monolith build, fetched from GitHub.
