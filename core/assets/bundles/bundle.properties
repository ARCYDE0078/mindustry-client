# --- Mapping Utilities port (ApsZoldat, v1.9): скрытые правила карты, планетный фон,
# улучшенные диалоги бана/раскрытия контента, снятие лимитов размера карты ---
client.setting.modsec-mu.category = Mapping Utilities
client.features.mod.mu.desc = Map-editor dialog extensions: hidden map rules (fog/cloud colors, border darkness, drag multiplier, Env flags, rules for any team 0-255, team cheats, mode name, mission text), a planet-background editor with 3D preview, banned/revealed content dialogs with a planet filter, and map sizes from 1 up to 2147483647. Lives inside the editor's Rules and Resize dialogs.

setting.mu_rules_mod.name = Rules Dialog extensions
setting.mu_rules_mod.description = Master switch for everything Mapping Utilities adds to the map rules dialog.
setting.mu_resize_mod.name = Remove map resize limits
setting.mu_resize_mod.description = Map sizes from 1 up to 2147483647 in the editor resize dialog. Huge maps WILL run out of memory - you have been warned.
setting.editor_hidden_rules.name = Enable Hidden Rules
setting.editor_hidden_rules.description = Show rules the vanilla dialog hides: fog/cloud colors, border darkness, drag multiplier, possession, payload update, any-team rules, mode name, mission and more.
setting.editor_planet_background.name = Add Planet Background Settings
setting.editor_environment_settings.name = Add Environment Settings
setting.editor_environment_settings.description = "Environment settings" button in the Environment category - raw Env bit flags (terrestrial/space/underwater/spores/scorching/oil/water/oxygen).
setting.editor_better_content_dialogs.name = Better Content Banning Dialogs
setting.editor_better_content_dialogs.description = Banned blocks/units and revealed blocks dialogs get a planet (database tab) filter and the button size below.
setting.editor_content_buttons_size.name = Content Buttons Size
setting.editor_content_buttons_size.description = Size of block/unit buttons in the better content dialogs.

